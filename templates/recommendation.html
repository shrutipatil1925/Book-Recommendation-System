<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendation System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="nav-content">

            <h1 class="navbar-brand">📚 My Book Recommender</h1>

            <ul class="navbar-nav">
                <li><a href="/">Home</a></li>
                <li><a href="/recommend">Recommend</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

        </div>
    </nav>

    <div class="container">

        <h1 class="heading">Recommend Books</h1>

        <form action="/recommend_books" method="post" class="search-form">

            <input
                type="text"
                name="user_input"
                placeholder="Enter Book Name..."
                class="search-box">

            <button type="submit" class="search-btn">
                Recommend
            </button>

        </form>

        {% if data %}

        <div class="books-container">

            {% for i in data %}

            <div class="card">

                <img src="{{ i[2] }}">

                <div class="card-body">

                    <h3>{{ i[0] }}</h3>

                    <p>{{ i[1] }}</p>

                </div>

            </div>

            {% endfor %}

        </div>

        {% endif %}

    </div>

</body>
</html>
